schema: spec-driven

context: |
  Tech stack: Node.js (v20+), Express, TypeScript, Prisma ORM (PostgreSQL), Zod, Vitest, Supertest
  Architecture: Standalone REST Backend API (callvu-agenda-api) with Controller / Service / Repository pattern
  Testing: Vitest unit and integration tests with Strict TDD approach
  Validation: Zod runtime schemas with inferred TypeScript types

strict_tdd: true

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  strict_tdd: true
  capabilities:
    detected: 2026-07-30
    test_runner:
      command: "pnpm test"
      framework: "vitest"
    test_layers:
      unit: true
      integration: true
      e2e: false
    coverage:
      available: true
      command: "pnpm vitest --coverage"
    quality_tools:
      linter: true
      type_checker: true
      formatter: true
